version: "3.8"

services:
  # --------------------------------------
  # Laravel Application (PHP-FPM)
  # --------------------------------------
  app:
    image: irfand0ank/mylibrary:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - pgsql
      - redis
    networks:
      - laravel

  # --------------------------------------
  # PostgreSQL Database
  # --------------------------------------
  pgsql:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - laravel

  # --------------------------------------
  # Redis Cache
  # --------------------------------------
  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - laravel

  # --------------------------------------
  # Nginx Web Server
  # --------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_data:/var/www/html:ro
      - certbot-etc:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - laravel

# --------------------------------------
# Volumes and Networks
# --------------------------------------
volumes:
  pg_data:
  app_data:
  certbot-etc:
  certbot-var:

networks:
  laravel:
    driver: bridge
